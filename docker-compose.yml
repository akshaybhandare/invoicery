version: '3.8'

services:
  app:
    build: .
    container_name: invoicery
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DB_PATH=/app/data/billing.db
    volumes:
      # Mount data folder to persist SQLite database file
      - ./data:/app/data
      # Mount attachments folder to persist uploaded documents
      - ./attachments:/app/attachments
    restart: unless-stopped
